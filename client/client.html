<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>

        window.onload = () => {

            const userForm = document.querySelector('#userForm');
            const nameForm = document.querySelector('#nameForm');
            const content = document.querySelector('#content');
            userForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const url = document.querySelector('#urlField').value;
                const method = document.querySelector('#methodSelect').value.toUpperCase();
                try {

                    const response = await fetch(url, {
                        method: method
                    });
                    content.innerHTML = `<p>Status: ${response.status}</p>`;

                    if (method !== 'HEAD') {

                        const data = await response.json();

                        content.innerHTML += `
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        `;
                    }


                } catch (error) {

                    content.innerHTML = `
                        <p>Request failed.</p>
                        <p>${error.message}</p>
                    `;
                }
            });
            nameForm.addEventListener('submit', async (e) => {

                e.preventDefault();
                const name = document.querySelector('#nameField').value;
                const age = document.querySelector('#ageField').value;
                try {

                    const response = await fetch('/addUser', {

                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            name: name,
                            age: age
                        })
                    });


                    content.innerHTML = `<p>Status: ${response.status}</p>`;
                    if (response.status === 204) {

                        content.innerHTML += `
                            <p>User updated successfully.</p>
                        `;

                        return;
                    }
                    const data = await response.json();

                    content.innerHTML += `
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;


                } catch (error) {
                    content.innerHTML = `
                        <p>Request failed.</p>
                        <p>${error.message}</p>
                    `;
                }
            });
        };

  </script>
</head>
<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1"/>
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get User" />
    </form>
  </section>
  <section id="content">
  </section>
</body>
</html>
